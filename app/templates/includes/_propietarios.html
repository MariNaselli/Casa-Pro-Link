<div class="card border-dark mb-4 shadow-sm overflow-hidden">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-bold"><i class="bi bi-shield-lock"></i> Legajo Interno (Datos Privados)</h6>
        <button type="button" class="btn btn-sm btn-outline-light" onclick="agregarPropietario()">+ Agregar Otro Dueño</button>
    </div>
    <div class="card-body bg-light" id="contenedor-propietarios">
        {% if p and p.propietarios %}
            {% for prop in p.propietarios %}
                {% set partes = prop.nombre.split(' ', 1) %}
                <div class="row mb-3 propietario-fila border-bottom pb-3 mt-2 align-items-end">
                    <div class="col-md-2 mb-2">
                        <label class="small fw-bold">Nombre</label>
                        <input type="text" name="propietario_nombre[]" class="form-control form-control-sm" value="{{ partes[0] if partes|length > 0 else '' }}">
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="small fw-bold">Apellido</label>
                        <input type="text" name="propietario_apellido[]" class="form-control form-control-sm" value="{{ partes[1] if partes|length > 1 else '' }}">
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="small fw-bold">DNI / CUIT</label>
                        <input type="text" name="propietario_dni[]" class="form-control form-control-sm" value="{{ prop.dni or '' }}">
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="small fw-bold">Teléfono</label>
                        <input type="text" name="propietario_tel[]" class="form-control form-control-sm" value="{{ prop.telefono or '' }}">
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="small fw-bold">E-mail</label>
                        <input type="email" name="propietario_email[]" class="form-control form-control-sm" value="{{ prop.email or '' }}">
                    </div>
                    <div class="col-md-1 mb-2 text-center">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.propietario-fila').remove()"><i class="bi bi-trash"></i></button>
                    </div>
                    <div class="col-md-12 mb-2">
                        <label class="small text-muted">Notas Privadas / Observaciones del Dueño</label>
                        <input type="text" name="notas_legajo[]" class="form-control form-control-sm" value="{{ prop.notas_legajo or '' }}" placeholder="Ej: Pretende USD 75.000 netos, vive en el exterior, etc.">
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <!-- Esta fila se muestra cuando creás una propiedad nueva de cero -->
            <div class="row mb-3 propietario-fila border-bottom pb-3 mt-2 align-items-end">
                <div class="col-md-2 mb-2">
                    <label class="small fw-bold">Nombre</label>
                    <input type="text" name="propietario_nombre[]" class="form-control form-control-sm">
                </div>
                <div class="col-md-2 mb-2">
                    <label class="small fw-bold">Apellido</label>
                    <input type="text" name="propietario_apellido[]" class="form-control form-control-sm">
                </div>
                <div class="col-md-2 mb-2">
                    <label class="small fw-bold">DNI / CUIT</label>
                    <input type="text" name="propietario_dni[]" class="form-control form-control-sm">
                </div>
                <div class="col-md-2 mb-2">
                    <label class="small fw-bold">Teléfono</label>
                    <input type="text" name="propietario_tel[]" class="form-control form-control-sm">
                </div>
                <div class="col-md-3 mb-2">
                    <label class="small fw-bold">E-mail</label>
                    <input type="email" name="propietario_email[]" class="form-control form-control-sm">
                </div>
                <div class="col-md-1 mb-2 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.propietario-fila').remove()"><i class="bi bi-trash"></i></button>
                </div>
                <div class="col-md-12 mb-2">
                    <label class="small text-muted">Notas Privadas / Observaciones del Dueño</label>
                    <input type="text" name="notas_legajo[]" class="form-control form-control-sm" placeholder="Ej: Pretende USD 75.000 netos, vive en el exterior, etc.">
                </div>
            </div>
        {% endif %}
    </div>
    <div class="card-footer bg-white border-top">
        <label class="form-label fw-bold text-danger small">Documentación Privada (PDFs / Escrituras / Planos)</label>
        <div class="upload-zone py-3 border-dashed rounded text-center cursor-pointer bg-light" onclick="document.getElementById('docsInput').click()">
            <i class="bi bi-file-earmark-pdf fs-4 text-danger d-block"></i>
            <span class="small fw-semibold">Hacé clic acá para adjuntar archivos del legajo</span>
        </div>
        <input type="file" name="documentos" id="docsInput" class="d-none" accept=".pdf,image/*" multiple onchange="handleFileSelect(this, 'lista-docs', 'doc')" />
        <div id="lista-docs" class="mt-2 d-flex flex-wrap gap-2"></div>
    </div>
</div>
